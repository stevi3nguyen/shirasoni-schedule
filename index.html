<style>
  :root {
    --bg: #0a0a0a;
    --bg-elevated: #161616;
    --bg-elevated-2: #1f1f1f;
    --border: #2a2a2a;
    --text: #f2f2f2;
    --text-secondary: #9a9a9a;
    --text-tertiary: #6b6b6b;
    --accent: #e8491d;
    --accent-dim: rgba(232, 73, 29, 0.16);
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f97316;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: var(--font); cursor: pointer; }
  input, select, textarea { font-family: var(--font); }
  a { color: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

  .avatar {
    border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center;
    justify-content: center; font-weight: 700; color: white; overflow: hidden;
    background-size: cover; background-position: center;
  }

  #root { min-height: 100vh; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 16px; border-radius: 10px; border: none;
    font-size: 14px; font-weight: 600; transition: opacity .15s;
  }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--bg-elevated-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: rgba(239,68,68,0.15); color: var(--red); }
  .btn-ghost { background: transparent; color: var(--text-secondary); }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-block { width: 100%; }

  .input {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    background: var(--bg-elevated-2); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; outline: none;
  }
  .input:focus { border-color: var(--accent); }
  .label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }

  .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 14px; }

  .chip {
    padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--bg-elevated-2); color: var(--text); border: 1px solid transparent;
    white-space: nowrap;
  }
  .chip.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
  }

  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }

  table.grid-table { border-collapse: collapse; width: 100%; }
  table.grid-table th, table.grid-table td { border: 1px solid var(--border); }
  table.grid-table th { background: var(--bg-elevated-2); padding: 8px 6px; font-size: 12px; text-align: center; position: sticky; top: 0; z-index: 2; }
  table.grid-table td { padding: 4px; vertical-align: top; }
  .name-cell { position: sticky; left: 0; background: var(--bg-elevated); z-index: 1; font-weight: 600; padding: 8px 10px !important; text-align: left; white-space: nowrap; }
  table.grid-table th.name-header { position: sticky; left: 0; top: 0; z-index: 3; text-align: left; }

  .section-row td { background: var(--bg-elevated-2); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-secondary); padding: 6px 10px !important; text-transform: uppercase; }

  .shift-chip {
    display: block; width: 100%; padding: 5px 4px; border-radius: 6px; text-align: center;
    font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid transparent;
  }
  .add-slot {
    display: block; width: 100%; padding: 5px 4px; border-radius: 6px; text-align: center;
    font-size: 11px; color: var(--text-tertiary); border: 1px dashed var(--border); cursor: pointer;
    min-height: 16px;
  }
  .add-slot:hover { border-color: var(--accent); color: var(--accent); }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,20,20,0.92);
    backdrop-filter: blur(12px); border-top: 1px solid var(--border);
    display: flex; z-index: 50; padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 10px 4px 8px; color: var(--text-tertiary); font-size: 11px; font-weight: 600;
    background: none; border: none; position: relative;
  }
  .tab-item.active { color: var(--accent); }
  .tab-badge {
    position: absolute; top: 4px; right: calc(50% - 20px); background: var(--red); color: white;
    font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 10px; gap: 12px; flex-wrap: wrap;
  }
  .page-title { font-size: 26px; font-weight: 800; margin: 0; }

  .content { padding: 0 20px 90px; max-width: 1400px; margin: 0 auto; }

  ::placeholder { color: var(--text-tertiary); }

  @media (max-width: 640px) {
    table.grid-table { font-size: 12px; }
  }
</style>

<body>
<div id="root"></div>
<script>
// ============================================================================
// FIREBASE SETUP — same project as the iOS app, so this is the same live data.
// ============================================================================
const firebaseConfig = {
  apiKey: "AIzaSyA_06sen_u_3kvZ4OmsxwzSvYVdlKuDVkc",
  authDomain: "shirasoni-schedule.firebaseapp.com",
  projectId: "shirasoni-schedule",
  storageBucket: "shirasoni-schedule.firebasestorage.app",
  messagingSenderId: "1084268857358",
  appId: "1:1084268857358:web:5b617f10271aa12798945f",
  measurementId: "G-DL9YSWZL0Z"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// ============================================================================
// ROLE CONFIG — mirrors EmployeeRole in the iOS app exactly.
// ============================================================================
const ALL_ROLES = ['Server','Sushi Server','Host','Sushi Chef','Teppanyaki Chef','Kitchen','Bartender','Dishwasher','Busser','Bar Back','Manager'];
const SELECTABLE_ROLES = ALL_ROLES; // Manager is now a selectable role too — separate from the isManager access flag
const SECTION_ORDER = ['Server','Kitchen','Sushi Chef','Bartender','Dishwasher'];
const ROLE_COLORS = {
  'Server': '#3b82f6',
  'Sushi Server': '#06b6d4',
  'Host': '#a855f7',
  'Sushi Chef': '#f97316',
  'Teppanyaki Chef': '#ec4899',
  'Kitchen': '#92400e',
  'Bartender': '#22c55e',
  'Dishwasher': '#8b8b8b',
  'Busser': '#b8870a',
  'Bar Back': '#4a8789',
  'Manager': '#6366f1',
};
function sectionRole(role) {
  if (role === 'Sushi Server' || role === 'Host' || role === 'Manager') return 'Server';
  if (role === 'Busser' || role === 'Bar Back') return 'Dishwasher';
  if (role === 'Teppanyaki Chef') return 'Kitchen';
  return role;
}
// Secondary sort key used only to order people WITHIN a merged section —
// e.g. inside Server: plain Servers/Sushi Servers first, then Hosts, then
// Managers; inside Kitchen: Teppanyaki Chefs first, then plain Kitchen
// staff. Purely cosmetic; doesn't affect which section they're grouped in.
function sectionSubOrder(role) {
  if (role === 'Host') return 1;
  if (role === 'Manager') return 2;
  if (role === 'Teppanyaki Chef') return 0;
  if (role === 'Kitchen') return 1;
  return 0;
}
function roleColor(role) { return ROLE_COLORS[role] || '#8b8b8b'; }

// ============================================================================
// AVATARS — shows the person's uploaded photo if they have one, otherwise a
// colored circle with their initials (same idea as Slack/Gmail defaults, and
// matches the iOS app's AvatarView). Deterministic color from the name so
// the same person always gets the same color everywhere.
// ============================================================================
function initialsFor(name) {
  const letters = (name || '').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  return letters || '?';
}
function avatarColorFor(name) {
  let hash = 0;
  for (const ch of (name || '')) hash += ch.charCodeAt(0);
  const hue = hash % 360;
  return `hsl(${hue}, 45%, 45%)`;
}
// A manually-added staff member (a manager just typed their name into
// Manage Staff, with no real login of their own) is tagged with an authUID
// starting with "manual-" — see addEmployee(). Avatars (photo or colored
// initials) are reserved for people who actually made a real account, so a
// manually-added entry always gets a plain blank placeholder instead.
function isManualEmployee(authUID) {
  return !!(authUID && authUID.startsWith('manual-'));
}
function avatarHtml(name, photoURL, size, authUID) {
  size = size || 36;
  const fontSize = Math.round(size * 0.4);
  if (isManualEmployee(authUID)) {
    const iconSize = Math.round(size * 0.55);
    return `<div class="avatar" style="width:${size}px;height:${size}px;background:#d9d9dd;display:flex;align-items:center;justify-content:center;">` +
      `<svg width="${iconSize}" height="${iconSize}" viewBox="0 0 24 24" fill="none" stroke="#9a9aa2" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>`;
  }
  if (photoURL) {
    return `<div class="avatar" style="width:${size}px;height:${size}px;background-image:url('${escapeHtml(photoURL)}');"></div>`;
  }
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${fontSize}px;background:${avatarColorFor(name)};">${escapeHtml(initialsFor(name))}</div>`;
}
const MAX_SHIFTS_PER_DAY = 2;

// ============================================================================
// GLOBAL STATE
// ============================================================================
const state = {
  authReady: false,
  user: null,
  employee: null,          // current signed-in employee doc {id,...}
  // True once the employee lookup has gotten its first real answer from
  // Firestore (found or not) — lets us tell "still loading" apart from
  // "genuinely no profile exists for this account." Without this, deleting
  // someone in Manage Staff (which removes their Firestore profile but not
  // their actual login) would leave them stuck on a loading screen forever
  // if they tried signing in again — both states look identical otherwise
  // (just employee == null).
  employeeLookupCompleted: false,
  employees: [],
  shifts: [],
  timeOffRequests: [],
  swapRequests: [],
  authError: null,
  profilePhotoUploading: false,
  authMode: 'signin',      // 'signin' | 'signup'

  tab: 'schedule',         // schedule | requests | build | approvals | profile

  schedule: { anchorDate: startOfWeekMonday(new Date()), roleFilter: null, viewMode: 'grid' },
  build:    { anchorDate: startOfWeekMonday(new Date()), roleFilter: null, viewMode: 'grid', copyMsg: null },
  approvals:{ viewMode: 'list', calAnchorDate: startOfWeekMonday(new Date()) },

  modals: {
    shiftEditor: null,     // { date, existingShift, presetEmployee }
    shiftEditorForm: {},
    shiftDetail: null,     // shift being viewed (staff read-only)
    employeePreview: null, // employee whose photo/name/role preview is open
    addStaff: null,        // { existingEmployee } or {} for add
    staffForm: {},
    editName: false,
    editNameValue: '',
    timeOff: false,
    timeOffForm: {},
    swap: false,
    swapForm: {},
    timeOffDetail: null,   // request for manager approval detail
    colorLegend: false,
    confirm: null,         // { title, message, confirmLabel, danger, onConfirm }
  },
};

// ============================================================================
// DATE / FORMAT HELPERS
// ============================================================================
function startOfWeekMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function getWeekDates(anchor) {
  const monday = startOfWeekMonday(anchor);
  return Array.from({length:7}, (_,i)=> addDays(monday, i));
}
function isSameDay(a,b){
  if (!a || !b) return false;
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function toDate(x) {
  if (!x) return null;
  if (x instanceof Date) return x;
  if (x.toDate) return x.toDate();
  return new Date(x);
}
function formatTime(date) {
  if (!date) return '';
  let h = date.getHours();
  const m = date.getMinutes();
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,'0')}`;
}
function formatDateShort(date) {
  return date.toLocaleDateString('en-US', { month:'short', day:'numeric'});
}
function formatDateFull(date) {
  return date.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}
function weekdayAbbr(date){ return date.toLocaleDateString('en-US', {weekday:'short'}); }
function weekRangeLabel(weekDates) {
  return `${formatDateShort(weekDates[0])} – ${formatDateShort(weekDates[6])}`;
}
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================================
// AUTH
// ============================================================================
let unsubEmployeeListener = null;
let unsubDataListeners = [];

async function signUp(email, password, name, role) {
  state.authError = null;
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    // Document ID is deliberately the Auth UID (not an auto ID) — matches the
    // iOS app's convention so Firestore rules (isManager() lookup) work correctly.
    await db.collection('employees').doc(cred.user.uid).set({
      authUID: cred.user.uid,
      name, phone: '', role,
      isManager: false, // manager status can only be granted by an existing manager, never at signup
      active: true,
      // New self-signups start out pending — a manager has to approve them
      // in the Approvals tab before they can see the schedule. Staff a
      // manager adds directly in Manage Staff skip this (see addEmployee).
      approved: false,
    });
  } catch (e) {
    state.authError = e.message;
    render();
  }
}
async function signIn(email, password) {
  state.authError = null;
  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (e) {
    state.authError = e.message;
    render();
  }
}
function signOut() {
  auth.signOut();
}

function loadCurrentEmployee(uid) {
  state.employeeLookupCompleted = false;
  if (unsubEmployeeListener) unsubEmployeeListener();
  unsubEmployeeListener = db.collection('employees').where('authUID', '==', uid)
    .onSnapshot(async (snap) => {
      if (snap.empty) {
        state.employee = null;
        state.employeeLookupCompleted = true;
        render();
        return;
      }
      const docSnap = snap.docs[0];
      state.employee = { id: docSnap.id, ...docSnap.data() };
      state.employeeLookupCompleted = true;
      render();
      // One-time self-repair: if this doc's ID doesn't match the Auth UID,
      // isManager() lookups in the Firestore rules can never find it. Copy
      // to the correctly-keyed doc, then remove the old one.
      if (docSnap.id !== uid) {
        try {
          await db.collection('employees').doc(uid).set(docSnap.data());
          await db.collection('employees').doc(docSnap.id).delete();
        } catch (e) { console.warn('employee doc migration failed', e); }
      }
    }, (err) => console.error('employee listener error', err));
}

function startDataListeners() {
  stopDataListeners();
  unsubDataListeners.push(
    db.collection('employees').onSnapshot(snap => {
      state.employees = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => console.error(err))
  );
  unsubDataListeners.push(
    db.collection('shifts').orderBy('startTime').onSnapshot(snap => {
      state.shifts = snap.docs.map(d => {
        const data = d.data();
        return { id: d.id, ...data, date: toDate(data.date), startTime: toDate(data.startTime) };
      });
      render();
    }, err => console.error(err))
  );
  unsubDataListeners.push(
    db.collection('timeOffRequests').orderBy('createdAt', 'desc').onSnapshot(snap => {
      state.timeOffRequests = snap.docs.map(d => {
        const data = d.data();
        return { id: d.id, ...data, startDate: toDate(data.startDate), endDate: toDate(data.endDate), createdAt: toDate(data.createdAt) };
      });
      render();
    }, err => console.error(err))
  );
  unsubDataListeners.push(
    db.collection('swapRequests').orderBy('createdAt', 'desc').onSnapshot(snap => {
      state.swapRequests = snap.docs.map(d => {
        const data = d.data();
        return { id: d.id, ...data, createdAt: toDate(data.createdAt) };
      });
      render();
    }, err => console.error(err))
  );
}
function stopDataListeners() {
  unsubDataListeners.forEach(fn => fn());
  unsubDataListeners = [];
}

auth.onAuthStateChanged(user => {
  state.authReady = true;
  state.user = user;
  if (user) {
    loadCurrentEmployee(user.uid);
    startDataListeners();
  } else {
    state.employee = null;
    state.employeeLookupCompleted = false;
    state.employees = []; state.shifts = []; state.timeOffRequests = []; state.swapRequests = [];
    stopDataListeners();
    if (unsubEmployeeListener) { unsubEmployeeListener(); unsubEmployeeListener = null; }
  }
  render();
});

// ============================================================================
// SHIFTS
// ============================================================================
async function addShift(shift) {
  await db.collection('shifts').add(shift);
}
async function updateShift(id, shift) {
  await db.collection('shifts').doc(id).update(shift);
}
async function deleteShift(id) {
  await db.collection('shifts').doc(id).delete();
}

function employeeMatchesRoleFilter(employee, roleFilter) {
  if (!roleFilter) return true;
  return sectionRole(employee.role) === sectionRole(roleFilter);
}

async function publishDraftShifts(weekDates, roleFilter) {
  const matchingIds = roleFilter
    ? new Set(state.employees.filter(e => employeeMatchesRoleFilter(e, roleFilter)).map(e => e.id))
    : null;
  const drafts = state.shifts.filter(s =>
    !s.published &&
    weekDates.some(d => isSameDay(d, s.date)) &&
    (!matchingIds || matchingIds.has(s.employeeId))
  );
  if (!drafts.length) return 0;
  const batch = db.batch();
  drafts.forEach(s => batch.update(db.collection('shifts').doc(s.id), { published: true }));
  await batch.commit();
  return drafts.length;
}
async function publishAllDraftShifts() {
  const drafts = state.shifts.filter(s => !s.published);
  if (!drafts.length) return 0;
  const batch = db.batch();
  drafts.forEach(s => batch.update(db.collection('shifts').doc(s.id), { published: true }));
  await batch.commit();
  return drafts.length;
}
async function copyPreviousWeek(currentWeekStart) {
  const prevStart = addDays(currentWeekStart, -7);
  const prevEnd = addDays(prevStart, 7);
  const prevShifts = state.shifts.filter(s => s.date >= prevStart && s.date < prevEnd);
  for (const s of prevShifts) {
    const newDate = addDays(s.date, 7);
    const newStart = addDays(s.startTime, 7);
    await addShift({
      employeeId: s.employeeId, employeeName: s.employeeName, role: s.role,
      date: newDate, startTime: newStart, notes: s.notes || '', published: false,
      vacuumDuty: !!s.vacuumDuty, ventCleaning: !!s.ventCleaning,
    });
  }
  return prevShifts.length;
}
async function clearShifts(weekDates) {
  const toDelete = state.shifts.filter(s => weekDates.some(d => isSameDay(d, s.date)));
  if (!toDelete.length) return 0;
  const batch = db.batch();
  toDelete.forEach(s => batch.delete(db.collection('shifts').doc(s.id)));
  await batch.commit();
  return toDelete.length;
}

// ============================================================================
// TIME OFF REQUESTS
// ============================================================================
async function submitTimeOffRequest(req) {
  await db.collection('timeOffRequests').add({ ...req, status: 'Pending', createdAt: new Date(), managerNote: '' });
}
async function updateTimeOffStatus(id, status, managerNote) {
  await db.collection('timeOffRequests').doc(id).update({ status, managerNote: managerNote || '' });
}
async function cancelTimeOffRequest(id) {
  await db.collection('timeOffRequests').doc(id).update({ status: 'Cancelled' });
}
async function deleteTimeOffRequest(id) {
  await db.collection('timeOffRequests').doc(id).delete();
}

// ============================================================================
// SWAP REQUESTS
// ============================================================================
async function submitSwapRequest(req) {
  await db.collection('swapRequests').add({ ...req, status: 'Waiting on Coworker', createdAt: new Date(), managerNote: '' });
}
async function respondToSwapAsCoworker(id, accept) {
  await db.collection('swapRequests').doc(id).update({ status: accept ? 'Waiting on Manager' : 'Denied' });
}
async function respondToSwapAsManager(req, approve) {
  await db.collection('swapRequests').doc(req.id).update({ status: approve ? 'Approved' : 'Denied' });
  if (approve) {
    const shift = state.shifts.find(s => s.id === req.shiftId);
    if (shift) {
      await updateShift(shift.id, { employeeId: req.coveringEmployeeId, employeeName: req.coveringEmployeeName });
    }
  }
}
async function cancelSwapRequest(req) {
  if (req.status === 'Approved') return;
  await db.collection('swapRequests').doc(req.id).update({ status: 'Cancelled' });
}
async function deleteSwapRequest(id) {
  await db.collection('swapRequests').doc(id).delete();
}

// ============================================================================
// EMPLOYEES
// ============================================================================
async function addEmployee(name, role, isManager) {
  await db.collection('employees').add({
    // A manager is adding this person directly — there's no self-signup to
    // gate, so they're approved immediately.
    authUID: 'manual-' + uuid(), name, phone: '', role, isManager: !!isManager, active: true, approved: true,
  });
}
async function updateEmployee(id, name, role, isManager) {
  await db.collection('employees').doc(id).update({ name, role, isManager: !!isManager });
}
async function deleteEmployee(id) {
  await db.collection('employees').doc(id).delete();
}
// Whether a manager has approved this account for schedule access. Missing
// field (undefined) means this doc predates the feature — treated as
// already approved so nobody currently using the app gets locked out. Only
// a brand-new self-signup explicitly has approved === false.
function isApproved(employee) {
  return employee?.approved !== false;
}
function pendingApprovalEmployees() {
  return state.employees.filter(e => e.approved === false);
}
async function approveEmployee(id) {
  await db.collection('employees').doc(id).update({ approved: true });
}
async function updateMyName(name) {
  if (!state.employee) return;
  const trimmed = (name || '').trim();
  if (!trimmed) return;
  await db.collection('employees').doc(state.employee.id).update({ name: trimmed });
}

// Uploads a new profile photo to Firebase Storage at
// "profilePhotos/{authUID}.jpg" (keyed off the signed-in Auth UID, matching
// the iOS app, so the Storage security rule can check "is this your own
// file" directly), then saves the download URL onto the employee doc.
async function uploadProfilePhoto(file) {
  if (!state.employee || !state.user || !file) return;
  state.profilePhotoUploading = true;
  render();
  try {
    const ref = storage.ref().child(`profilePhotos/${state.user.uid}.jpg`);
    await ref.put(file, { contentType: 'image/jpeg' });
    const url = await ref.getDownloadURL();
    await db.collection('employees').doc(state.employee.id).update({ photoURL: url });
  } catch (e) {
    state.authError = null;
    alert("Couldn't upload photo: " + e.message);
  } finally {
    state.profilePhotoUploading = false;
    render();
  }
}

function render() {
  const root = document.getElementById('root');
  if (!state.authReady) {
    root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary)">Loading…</div>`;
    return;
  }
  if (!state.user || !state.employee) {
    if (state.user && !state.employee) {
      root.innerHTML = state.employeeLookupCompleted ? renderNoProfileFoundScreen() : renderLoadingProfileScreen();
      if (state.employeeLookupCompleted) document.getElementById('npf-signout')?.addEventListener('click', signOut);
    } else {
      root.innerHTML = renderAuthScreen();
      attachAuthHandlers();
    }
    return;
  }
  if (!isApproved(state.employee)) {
    root.innerHTML = renderPendingApprovalScreen();
    document.getElementById('pa-signout')?.addEventListener('click', signOut);
    return;
  }
  root.innerHTML = renderApp();
  attachAppHandlers();
}

// Signed up successfully, but no manager has approved the account yet — no
// schedule access until they do.
function renderPendingApprovalScreen() {
  return `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
      <div style="max-width:380px;text-align:center;">
        <div style="font-size:40px;margin-bottom:12px;">⏳</div>
        <h2 style="margin:0 0 10px;">Waiting on Approval</h2>
        <p style="color:var(--text-secondary);font-size:14px;line-height:1.5;margin:0 0 20px;">
          Your account was created, but a manager needs to approve it before you can see the schedule. Check back soon, or ask your manager to approve you in the app.
        </p>
        <button class="btn btn-danger" id="pa-signout">Sign Out</button>
      </div>
    </div>
  `;
}

function renderLoadingProfileScreen() {
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary)">Loading your profile…</div>`;
}

// Signed in successfully, but no Firestore profile was found for this
// account — most likely a manager removed them from the roster. Without
// this, it would look identical to "still loading" (both are just
// employee == null) and they'd be stuck on a spinner forever with no way out.
function renderNoProfileFoundScreen() {
  return `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
      <div style="max-width:380px;text-align:center;">
        <div style="font-size:40px;margin-bottom:12px;">⚠️</div>

        <p style="color:var(--text-secondary);font-size:14px;line-height:1.5;margin:0 0 20px;">
          Your login worked, but there's no staff profile linked to this account anymore — a manager may have removed you from the roster. Contact your manager, or sign out and try a different account.
        </p>
        <button class="btn btn-danger" id="npf-signout">Sign Out</button>
      </div>
    </div>
  `;
}

        <div class="card" style="padding:20px;">

          <label class="label">Email</label>
          <input class="input" id="su-email" type="email" style="margin-bottom:12px;" autocomplete="username">

          <button class="btn btn-primary btn-block" id="btn-signup">Create Account</button>

}

function attachAuthHandlers() {
  const $ = id => document.getElementById(id);
  if (state.authMode === 'signin') {
    $('btn-signin')?.addEventListener('click', () => signIn($('auth-email').value.trim(), $('auth-password').value));
    $('btn-goto-signup')?.addEventListener('click', () => { state.authMode = 'signup'; state.authError = null; render(); });
    $('auth-password')?.addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-signin').click(); });
  } else {
    $('btn-signup')?.addEventListener('click', () => signUp(
      $('su-email').value.trim(), $('su-password').value, $('su-name').value.trim(), $('su-role').value
    ));
    $('btn-goto-signin')?.addEventListener('click', () => { state.authMode = 'signin'; state.authError = null; render(); });
  }
}

// ============================================================================
// APP SHELL + TAB BAR
// ============================================================================
function pendingResponseCount() {
  const myId = state.employee?.id;
  if (!myId) return 0;
  return state.swapRequests.filter(s => s.status === 'Waiting on Coworker' && s.coveringEmployeeId === myId).length;
}
function pendingApprovalCount() {
  const pendingTimeOff = state.timeOffRequests.filter(r => r.status === 'Pending').length;
  const pendingSwaps = state.swapRequests.filter(s => s.status === 'Waiting on Manager').length;
  return pendingTimeOff + pendingSwaps + pendingApprovalEmployees().length;
}

function renderApp() {
  const isManager = !!state.employee?.isManager;
  let body = '';
  if (state.tab === 'schedule') body = renderScheduleTab();
  else if (state.tab === 'requests') body = renderRequestsTab();
  else if (state.tab === 'build' && isManager) body = renderBuildTab();
  else if (state.tab === 'approvals' && isManager) body = renderApprovalsTab();
  else if (state.tab === 'profile') body = renderProfileTab();
  else if (state.tab === 'manageStaff' && isManager) body = renderManageStaffTab();
  else if (state.tab === 'viewStaff' && !isManager) body = renderViewStaffTab();
  else body = renderScheduleTab();

  const reqBadge = pendingResponseCount();
  const apprBadge = pendingApprovalCount();

  return `
    <div>
      ${body}
    </div>
    <div class="tabbar">
      <button class="tab-item ${state.tab==='schedule'?'active':''}" data-tab="schedule">
        ${ICONS.calendar}<span>Schedule</span>
      </button>
      <button class="tab-item ${state.tab==='requests'?'active':''}" data-tab="requests">
        ${reqBadge > 0 ? `<span class="tab-badge">${reqBadge}</span>` : ''}
        ${ICONS.mail}<span>Requests</span>
      </button>
      ${isManager ? `
        <button class="tab-item ${state.tab==='build'?'active':''}" data-tab="build">
          ${ICONS.edit}<span>Build</span>
        </button>
        <button class="tab-item ${state.tab==='approvals'?'active':''}" data-tab="approvals">
          ${apprBadge > 0 ? `<span class="tab-badge">${apprBadge}</span>` : ''}
          ${ICONS.check}<span>Approvals</span>
        </button>
      ` : ''}
      <button class="tab-item ${state.tab==='profile'?'active':''}" data-tab="profile">
        ${ICONS.user}<span>Profile</span>
      </button>
    </div>
    ${renderModals()}
  `;
}

function attachAppHandlers() {
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.addEventListener('click', () => { state.tab = el.dataset.tab; render(); });
  });
  attachScheduleHandlers();
  attachBuildHandlers();
  attachRequestsHandlers();
  attachApprovalsHandlers();
  attachProfileHandlers();
  attachManageStaffHandlers();
  attachViewStaffHandlers();
  attachModalHandlers();
  attachEmployeePreviewHandlers();
}

// Tapping a name anywhere on the schedule (grid name column, a shift row,
// or a shift's detail sheet) opens a small read-only preview of that
// person's photo, name, and role. Shared across whichever tab is currently
// rendered, since only one tab's markup exists in the DOM at a time.
function attachEmployeePreviewHandlers() {
  document.querySelectorAll('[data-employee-preview]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const emp = state.employees.find(x => x.id === el.dataset.employeePreview);
      if (emp) { state.modals.employeePreview = emp; render(); }
    });
  });
}

// ============================================================================
// SCHEDULE TAB (staff-facing, read-only)
// ============================================================================
// Non-manager staff only ever see their own SECTION's schedule in this tab
// (e.g. a Server sees every Server/Sushi Server shift, but no Host or
// Kitchen shifts) — they can't browse other groups. Managers keep full
// visibility here (and in Build Schedule) since they need the whole picture.
function isRestrictedToOwnSchedule() {
  return !state.employee?.isManager;
}
// The role filter actually in effect: a manager's own chip selection, or —
// for restricted staff — their own profile role, locked in regardless of
// what schedule.roleFilter holds (its chips are hidden for them anyway).
function effectiveScheduleRoleFilter(roleFilter) {
  return isRestrictedToOwnSchedule() ? (state.employee?.role || null) : roleFilter;
}

function renderScheduleTab() {
  const s = state.schedule;
  const weekDates = getWeekDates(s.anchorDate);
  const restricted = isRestrictedToOwnSchedule();
  const effectiveFilter = effectiveScheduleRoleFilter(s.roleFilter);
  return `
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="${LOGO_DATA_URI}" alt="Shirasoni" style="width:30px;height:auto;">
        <h1 class="page-title" style="font-size:22px;">Schedule</h1>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary btn-sm" id="sched-info-btn">${ICONS.info}</button>
        <button class="btn btn-secondary btn-sm" id="sched-viewmode-btn">${s.viewMode==='grid'?ICONS.list:ICONS.grid}</button>
      </div>
    </div>
    <div class="content">
      ${renderWeekNav(weekDates, 'sched-prev-week', 'sched-next-week')}
      ${restricted ? '' : renderRoleChips(s.roleFilter, 'sched-role-chip')}
      ${s.viewMode === 'grid'
        ? renderScheduleGrid(weekDates, effectiveFilter, false)
        : renderScheduleList(weekDates, { ...s, roleFilter: effectiveFilter })}
    </div>
  `;
}

function renderWeekNav(weekDates, prevId, nextId) {
  return `
    <div style="display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0 16px;">
      <button class="btn btn-ghost btn-sm" id="${prevId}">${ICONS.chevLeft}</button>
      <div style="font-weight:700;font-size:15px;">${weekRangeLabel(weekDates)}</div>
      <button class="btn btn-ghost btn-sm" id="${nextId}">${ICONS.chevRight}</button>
    </div>
  `;
}
// Kitchen's filter chip (and everywhere else its name shows up — the
// publish banner, PDF export label/title/filename) now stands in for both
// Kitchen and Teppanyaki Chef (they're merged into one section — see
// sectionRole()), so the label needs to say that instead of just "Kitchen".
function filterChipTitle(role) {
  return role === 'Kitchen' ? 'Teppan/Kitchen' : role;
}
function renderRoleChips(activeRole, dataAttr) {
  return `
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch;">
      <button class="chip ${!activeRole?'active':''}" data-${dataAttr}="">All</button>
      ${SELECTABLE_ROLES.filter(r => r !== 'Sushi Server' && r !== 'Busser' && r !== 'Bar Back' && r !== 'Host' && r !== 'Manager' && r !== 'Teppanyaki Chef').map(r =>
        `<button class="chip ${activeRole===r?'active':''}" data-${dataAttr}="${r}">${filterChipTitle(r)}</button>`
      ).join('')}
    </div>
  `;
}

function employeeRowEmployees(weekDates, roleFilter, managerMode) {
  const relevant = state.shifts.filter(sh =>
    (managerMode || sh.published) &&
    weekDates.some(d => isSameDay(d, sh.date)) &&
    (() => {
      const emp = state.employees.find(e => e.id === sh.employeeId);
      return emp ? employeeMatchesRoleFilter(emp, roleFilter) : true;
    })()
  );
  let list;
  if (managerMode) {
    const idsWithShift = new Set(relevant.map(s => s.employeeId));
    list = state.employees.filter(e => e.active && (employeeMatchesRoleFilter(e, roleFilter) || idsWithShift.has(e.id)));
  } else {
    const ids = new Set(relevant.map(s => s.employeeId));
    list = state.employees.filter(e => ids.has(e.id));
  }
  // Same clustering as the "All" grouped view (e.g. Teppanyaki Chefs before
  // plain Kitchen staff) applies here too, so a filtered or restricted list
  // isn't just flat alphabetical.
  list.sort((a,b) => sectionSubOrder(a.role) - sectionSubOrder(b.role) || a.name.localeCompare(b.name));
  return { employees: list, relevantShifts: relevant };
}

function shiftsFor(relevantShifts, employeeId, date) {
  return relevantShifts.filter(s => s.employeeId === employeeId && isSameDay(s.date, date))
    .sort((a,b) => a.startTime - b.startTime);
}

function renderScheduleGrid(weekDates, roleFilter, managerMode, onCellAction) {
  const { employees, relevantShifts } = employeeRowEmployees(weekDates, roleFilter, managerMode);

  function cellHtml(emp, date) {
    const dayShifts = shiftsFor(relevantShifts, emp.id, date);
    let inner = dayShifts.map(sh => {
      const color = roleColor(sh.role);
      const opacity = sh.published ? '2a' : '14';
      return `<div class="shift-chip" style="background:${color}${opacity};color:${color};border-color:${color}55;" data-shift-chip="${sh.id}">${formatTime(sh.startTime)}${sh.vacuumDuty ? ` <span style="font-size:13px;">🧹</span>` : ''}${sh.ventCleaning ? ` <span style="font-size:13px;">💨</span>` : ''}</div>`;
    }).join('<div style="height:2px"></div>');
    if (managerMode && dayShifts.length < MAX_SHIFTS_PER_DAY) {
      if (inner) inner += '<div style="height:2px"></div>';
      inner += `<div class="add-slot" data-add-slot="${emp.id}|${date.toISOString()}">+</div>`;
    }
    return `<td>${inner || ''}</td>`;
  }

  function rowHtml(emp) {
    const isMe = state.employee && emp.id === state.employee.id;
    return `<tr${isMe ? ' style="background:var(--accent-dim);"' : ''}>
      <td class="name-cell">
        <button data-employee-preview="${emp.id}" style="background:none;border:none;color:${isMe?'var(--accent)':'inherit'};font:inherit;font-weight:${isMe?'700':'inherit'};cursor:pointer;display:flex;align-items:center;gap:6px;padding:0;">
          ${avatarHtml(emp.name, emp.photoURL, 20, emp.authUID)}
          <span>${escapeHtml(emp.name)}</span>
        </button>
      </td>
      ${weekDates.map(d => cellHtml(emp, d)).join('')}
    </tr>`;
  }

  let bodyRows;
  if (!employees.length) {
    bodyRows = `<tr><td colspan="8" style="text-align:center;color:var(--text-tertiary);padding:40px 0;">${managerMode ? 'No staff yet — add employees first' : 'No published shifts this week'}</td></tr>`;
  } else if (!roleFilter) {
    const grouped = {};
    employees.forEach(e => {
      const sec = sectionRole(e.role);
      (grouped[sec] = grouped[sec] || []).push(e);
    });
    Object.values(grouped).forEach(list => {
      list.sort((a,b) => sectionSubOrder(a.role) - sectionSubOrder(b.role) || a.name.localeCompare(b.name));
    });
    bodyRows = SECTION_ORDER.filter(sec => grouped[sec]?.length).map(sec => `
      <tr class="section-row"><td colspan="8">${filterChipTitle(sec)}</td></tr>
      ${grouped[sec].map(rowHtml).join('')}
    `).join('');
  } else {
    bodyRows = employees.map(rowHtml).join('');
  }

  return `
    <div class="card" style="overflow-x:auto;margin-bottom:20px;">
      <table class="grid-table">

function draftCountForWeek(weekDates, roleFilter) {
  const matchingIds = roleFilter
    ? new Set(state.employees.filter(e => employeeMatchesRoleFilter(e, roleFilter)).map(e => e.id))
    : null;
  return state.shifts.filter(s => !s.published && weekDates.some(d => isSameDay(d, s.date)) && (!matchingIds || matchingIds.has(s.employeeId))).length;
}
function totalDraftCount() {
  return state.shifts.filter(s => !s.published).length;
}

function renderBuildList(weekDates, b) {
  const selectedDate = b.selectedDate || weekDates[0];
  const dayShifts = state.shifts.filter(sh => isSameDay(sh.date, selectedDate) &&

function openShiftEditor(date, existingShift, presetEmployee) {
  state.modals.shiftEditor = { date, existingShift, presetEmployee };
  if (existingShift) {
    state.modals.shiftEditorForm = {
      employeeId: existingShift.employeeId, role: existingShift.role,
      hour: (() => { const h = existingShift.startTime.getHours(); const h12 = h%12===0?12:h%12; return h12; })(),
      minute: existingShift.startTime.getMinutes(),
      isPM: existingShift.startTime.getHours() >= 12,
      notes: existingShift.notes || '', published: existingShift.published,
      vacuumDuty: !!existingShift.vacuumDuty, ventCleaning: !!existingShift.ventCleaning,
    };
  } else {
    state.modals.shiftEditorForm = {
      employeeId: presetEmployee ? presetEmployee.id : '',
      role: presetEmployee ? presetEmployee.role : SELECTABLE_ROLES[0],
      hour: 4, minute: 0, isPM: true, notes: '', published: false,
      vacuumDuty: false, ventCleaning: false,
    };
  }
  render();
}

function statusColor(status) {
  if (status === 'Approved') return 'var(--green)';
  if (status === 'Denied') return 'var(--red)';
  if (status === 'Cancelled') return 'var(--text-tertiary)';
  return 'var(--orange)';
}

function renderTimeOffRow(r, divider) {
  const canCancel = r.status !== 'Cancelled';
  return `
    <div style="padding:14px 16px;${divider?'border-bottom:1px solid var(--border);':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div style="font-weight:600;font-size:14px;">${formatDateShort(r.startDate)} – ${formatDateShort(r.endDate)}</div>
        <span class="badge" style="background:${statusColor(r.status)}22;color:${statusColor(r.status)};">${r.status}</span>
      </div>
      ${r.reason ? `<div style="color:var(--text-secondary);font-size:13px;margin-top:2px;">${escapeHtml(r.reason)}</div>` : ''}
      ${r.managerNote ? `<div style="color:var(--text-tertiary);font-size:12px;margin-top:2px;font-style:italic;">Manager: ${escapeHtml(r.managerNote)}</div>` : ''}

        ${canCancel ? `<button data-cancel-timeoff="${r.id}" style="background:none;border:none;color:var(--red);font-size:12px;font-weight:600;padding:0;cursor:pointer;">Cancel Request</button>` : ''}

}
function renderSwapRow(s, myId, divider) {

      </div>
      <div style="color:var(--text-secondary);font-size:13px;margin-top:2px;">${s.requestingEmployeeId===myId ? `Covering: ${escapeHtml(s.coveringEmployeeName)}` : `From: ${escapeHtml(s.requestingEmployeeName)}`}</div>

function renderTimeOffCalendar() {
  const a = state.approvals;
  const weekDates = getWeekDates(a.calAnchorDate);
  const relevant = state.timeOffRequests.filter(r => (r.status==='Pending'||r.status==='Approved') &&
    weekDates.some(d => d >= new Date(r.startDate.getFullYear(),r.startDate.getMonth(),r.startDate.getDate()) && d <= new Date(r.endDate.getFullYear(),r.endDate.getMonth(),r.endDate.getDate())));
  const empIds = new Set(relevant.map(r => r.employeeId));
  const employees = state.employees.filter(e => empIds.has(e.id)).sort((a2,b)=>a2.name.localeCompare(b.name));
  const grouped = {};
  employees.forEach(e => { (grouped[sectionRole(e.role)] = grouped[sectionRole(e.role)] || []).push(e); });

  function cellFor(emp, date) {
    const req = relevant.find(r => r.employeeId === emp.id && date >= new Date(r.startDate.getFullYear(),r.startDate.getMonth(),r.startDate.getDate()) && date <= new Date(r.endDate.getFullYear(),r.endDate.getMonth(),r.endDate.getDate()));
    if (!req) return '<td></td>';
    const color = req.status === 'Approved' ? 'var(--green)' : 'var(--orange)';
    return `<td><div data-timeoff-cell="${req.id}" style="background:${color}22;border:1px solid ${color};border-radius:6px;text-align:center;padding:4px;cursor:pointer;color:${color};font-size:16px;">☀</div></td>`;
  }

  return `
    ${renderWeekNav(weekDates, 'cal-prev-week', 'cal-next-week')}
    ${!employees.length ? `
      <div class="card" style="padding:50px 20px;text-align:center;color:var(--text-tertiary);">Nobody has a pending or approved time-off request for ${weekRangeLabel(weekDates)}.</div>
    ` : `
      <div class="card" style="overflow-x:auto;">
        <table class="grid-table">
          <thead><tr><th class="name-header"></th>${weekDates.map(d=>`<th>${weekdayAbbr(d)}<br><span style="color:var(--text-tertiary);font-weight:500;">${d.getDate()}</span></th>`).join('')}</tr></thead>
          <tbody>
            ${SECTION_ORDER.filter(sec=>grouped[sec]?.length).map(sec => `
              <tr class="section-row"><td colspan="8">${filterChipTitle(sec)}</td></tr>
              ${grouped[sec].map(e => `<tr><td class="name-cell">${escapeHtml(e.name)}</td>${weekDates.map(d=>cellFor(e,d)).join('')}</tr>`).join('')}
            `).join('')}
          </tbody>
        </table>
      </div>
      <div style="display:flex;gap:16px;color:var(--text-tertiary);font-size:12px;padding:12px 0;">
        <span style="color:var(--orange);">☀ Pending</span><span style="color:var(--green);">☀ Approved</span>
      </div>
    `}
  `;
}

function attachApprovalsHandlers() {
  if (state.tab !== 'approvals') return;
  const $ = id => document.getElementById(id);
  const a = state.approvals;
  document.querySelectorAll('[data-appr-mode]').forEach(el => el.addEventListener('click', () => { a.viewMode = el.dataset.apprMode; render(); }));
  $('cal-prev-week')?.addEventListener('click', () => { a.calAnchorDate = addDays(a.calAnchorDate, -7); render(); });
  $('cal-next-week')?.addEventListener('click', () => { a.calAnchorDate = addDays(a.calAnchorDate, 7); render(); });
  document.querySelectorAll('[data-timeoff-decision]').forEach(el => el.addEventListener('click', () => {

    });
  }));
}

// ---- Shift editor ----
// Whoever else is already on vacuum duty the same calendar day, if anyone —
// excludes the shift currently being edited. Mirrors the iOS app's rule that
// only one person per night can be on closing vacuum duty.
function otherVacuumShiftOnDate(date, excludingShiftId) {
  return state.shifts.find(s => s.vacuumDuty && isSameDay(s.date, date) && s.id !== excludingShiftId) || null;
}
// Same idea, tracked independently, for the vent cleaning closing duty.
function otherVentShiftOnDate(date, excludingShiftId) {
  return state.shifts.find(s => s.ventCleaning && isSameDay(s.date, date) && s.id !== excludingShiftId) || null;
}
// Vacuum duty and vent cleaning only make sense for whoever's closing the kitchen.
function vacuumDutyEligible(role) {
  return role === 'Kitchen' || role === 'Teppanyaki Chef';
}
function ventCleaningEligible(role) {
  return role === 'Kitchen' || role === 'Teppanyaki Chef';
}
function renderShiftEditorModal() {
  const { date, existingShift } = state.modals.shiftEditor;
  const f = state.modals.shiftEditorForm;
  const activeEmployees = state.employees.filter(e => e.active);
  const vacuumEligible = vacuumDutyEligible(f.role);
  const otherVacuum = (vacuumEligible && f.vacuumDuty) ? otherVacuumShiftOnDate(date, existingShift?.id) : null;
  const ventEligible = ventCleaningEligible(f.role);
  const otherVent = (ventEligible && f.ventCleaning) ? otherVentShiftOnDate(date, existingShift?.id) : null;
  return modalWrap(existingShift ? 'Edit Shift' : 'Add Shift', `

    <select class="input" id="se-role" style="margin-bottom:14px;">
      ${SELECTABLE_ROLES.map(r => `<option value="${r}" ${f.role===r?'selected':''}>${r}</option>`).join('')}

      <input class="input" id="se-minute" type="number" min="0" max="59" value="${String(f.minute).padStart(2,'0')}" style="width:64px;text-align:center;">
      <div style="display:flex;background:var(--bg-elevated-2);border-radius:8px;overflow:hidden;margin-left:6px;">
        <button type="button" id="se-am" class="btn-sm" style="border:none;padding:9px 14px;background:${!f.isPM?'var(--accent)':'transparent'};color:${!f.isPM?'white':'var(--text-secondary)'};">AM</button>
        <button type="button" id="se-pm" class="btn-sm" style="border:none;padding:9px 14px;background:${f.isPM?'var(--accent)':'transparent'};color:${f.isPM?'white':'var(--text-secondary)'};">PM</button>
      </div>
    </div>
    <p style="font-size:12px;color:var(--text-tertiary);margin:0 0 14px;">No end time needed — shift lengths vary too much in practice.</p>
    <label class="label">Notes (optional)</label>
    <input class="input" id="se-notes" type="text" value="${escapeHtml(f.notes||'')}" placeholder="e.g. training shift" style="margin-bottom:14px;">
    <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;margin-bottom:14px;">

function attachShiftEditorHandlers() {
  const $ = id => document.getElementById(id);
  const f = state.modals.shiftEditorForm;
  const close = () => { state.modals.shiftEditor = null; render(); };
  $('se-close')?.addEventListener('click', close);
  $('se-cancel')?.addEventListener('click', close);
  $('se-employee')?.addEventListener('change', e => { f.employeeId = e.target.value; });
  $('se-role')?.addEventListener('change', e => {
    f.role = e.target.value;
    if (!vacuumDutyEligible(f.role)) f.vacuumDuty = false;
    if (!ventCleaningEligible(f.role)) f.ventCleaning = false;
    render();
  });
  $('se-hour')?.addEventListener('input', e => { f.hour = parseInt(e.target.value)||1; });
  $('se-minute')?.addEventListener('input', e => { f.minute = parseInt(e.target.value)||0; });
  $('se-notes')?.addEventListener('input', e => { f.notes = e.target.value; });
  $('se-published')?.addEventListener('change', e => { f.published = e.target.checked; });
  $('se-vacuum')?.addEventListener('change', e => { f.vacuumDuty = e.target.checked; render(); });
  $('se-vent')?.addEventListener('change', e => { f.ventCleaning = e.target.checked; render(); });
  $('se-am')?.addEventListener('click', () => { f.isPM = false; render(); });
  $('se-pm')?.addEventListener('click', () => { f.isPM = true; render(); });
  $('se-delete')?.addEventListener('click', () => {
    const { existingShift } = state.modals.shiftEditor;
    showConfirm({
      title: 'Delete this shift?', confirmLabel: 'Delete Shift', danger: true,
      onConfirm: async () => {
        await deleteShift(existingShift.id);
        state.modals.shiftEditor = null;
        render();
      }
    });
  });
  $('se-save')?.addEventListener('click', async () => {
    const { date, existingShift } = state.modals.shiftEditor;
    if (!f.employeeId) return;
    const emp = state.employees.find(e => e.id === f.employeeId);
    let hour24 = f.hour % 12;
    if (f.isPM) hour24 += 12;
    const startTime = new Date(date);
    startTime.setHours(hour24, f.minute, 0, 0);
    const payload = {
      employeeId: f.employeeId, employeeName: emp.name, role: f.role,
      date: new Date(date.getFullYear(), date.getMonth(), date.getDate()),
      startTime, notes: f.notes || '', published: !!f.published,
      vacuumDuty: vacuumDutyEligible(f.role) && !!f.vacuumDuty,
      ventCleaning: ventCleaningEligible(f.role) && !!f.ventCleaning,
    };
    // Only one person per night can be on vacuum duty — clear it from
    // whoever else had it that same night before saving this one.
    if (payload.vacuumDuty) {
      const other = otherVacuumShiftOnDate(payload.date, existingShift?.id);
      if (other) await updateShift(other.id, { vacuumDuty: false });
    }
    // Same one-person-per-night rule for vent cleaning, tracked independently.
    if (payload.ventCleaning) {
      const other = otherVentShiftOnDate(payload.date, existingShift?.id);
      if (other) await updateShift(other.id, { ventCleaning: false });
    }
    if (existingShift) await updateShift(existingShift.id, payload);
    else await addShift(payload);
    state.modals.shiftEditor = null;
    render();
  });
}

// One mini calendar — tap a day to set the start, tap another to set the
// end (days in between highlight automatically), same behavior as the iOS
// app's custom range calendar, rather than two separate date inputs.
function renderTimeOffFormModal() {
  const f = state.modals.timeOffForm;
  if (!f.calendarMonth) f.calendarMonth = new Date(f.startDate.getFullYear(), f.startDate.getMonth(), 1);
  if (!f.rangePhase) f.rangePhase = 'first';

  return modalWrap('Request Time Off', `
    <div style="text-align:center;font-weight:600;margin-bottom:10px;">${rangeLabelFor(f.startDate, f.endDate)}</div>
    ${renderMiniCalendar(f.calendarMonth, f.startDate, f.endDate)}
    <p style="font-size:11px;color:var(--text-tertiary);margin:8px 0 14px;">Tap a day to start the range, then tap another day to set the end.</p>
    <label class="label">Reason (optional)</label>
    <textarea class="input" id="to-reason" rows="3" placeholder="e.g. family trip">${escapeHtml(f.reason||'')}</textarea>
  `, `
    <button class="btn btn-secondary" id="to-cancel">Cancel</button>
    <button class="btn btn-primary" id="to-submit">Submit</button>
  `, 'to-close');
}

function rangeLabelFor(start, end) {
  const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return isSameDay(start, end) ? fmt(start) : `${fmt(start)} – ${fmt(end)}`;
}

function renderMiniCalendar(monthDate, startDate, endDate) {
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = monthDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const todayStr = new Date().toDateString();

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const inRange = d >= stripTime(startDate) && d <= stripTime(endDate);
    const isEndpoint = isSameDay(d, startDate) || isSameDay(d, endDate);
    const isToday = d.toDateString() === todayStr;
    let style = 'display:flex;align-items:center;justify-content:center;height:34px;border-radius:8px;cursor:pointer;font-size:13px;';
    if (isEndpoint) style += 'background:var(--accent);color:white;font-weight:700;';
    else if (inRange) style += 'background:var(--accent-dim);color:var(--accent);';
    else if (isToday) style += 'border:1px solid var(--accent);';
    cells += `<div data-cal-day="${d.toISOString()}" style="${style}">${day}</div>`;
  }

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <button class="btn btn-ghost btn-sm" id="cal-prev-month">‹</button>
      <div style="font-weight:600;font-size:14px;">${monthLabel}</div>
      <button class="btn btn-ghost btn-sm" id="cal-next-month">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;color:var(--text-tertiary);text-align:center;margin-bottom:4px;">
      <div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div><div>Su</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">
      ${cells}
    </div>
  `;
}
function stripTime(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function attachTimeOffFormHandlers() {
  const $ = id => document.getElementById(id);
  const f = state.modals.timeOffForm;
  const close = () => { state.modals.timeOff = false; render(); };
  $('to-close')?.addEventListener('click', close);
  $('to-cancel')?.addEventListener('click', close);
  $('to-reason')?.addEventListener('input', e => { f.reason = e.target.value; });
  $('cal-prev-month')?.addEventListener('click', () => {
    f.calendarMonth = new Date(f.calendarMonth.getFullYear(), f.calendarMonth.getMonth() - 1, 1);
    render();
  });
  $('cal-next-month')?.addEventListener('click', () => {
    f.calendarMonth = new Date(f.calendarMonth.getFullYear(), f.calendarMonth.getMonth() + 1, 1);
    render();
  });
  document.querySelectorAll('[data-cal-day]').forEach(el => {
    el.addEventListener('click', () => {
      const tapped = new Date(el.dataset.calDay);
      if (f.rangePhase === 'first') {
        f.startDate = tapped; f.endDate = tapped; f.rangePhase = 'second';
      } else {
        if (tapped < f.startDate) { f.endDate = f.startDate; f.startDate = tapped; }
        else { f.endDate = tapped; }
        f.rangePhase = 'first';
      }
      render();
    });
  });
  $('to-submit')?.addEventListener('click', async () => {
    await submitTimeOffRequest({
      employeeId: state.employee.id, employeeName: state.employee.name,
      startDate: f.startDate, endDate: f.endDate, reason: f.reason || '',
    });
    state.modals.timeOff = false;
    render();
  });
}

function exportSchedulePDF(weekDates, roleFilter) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
  const margin = 36;
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  let y = margin;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
  doc.text(`Shirasoni — ${roleFilter ? filterChipTitle(roleFilter) : 'All Staff'} Schedule`, margin, y + 14);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(120);
  doc.text(weekRangeLabel(weekDates), margin, y + 32);
  doc.setTextColor(0);
  y += 50;

  const nameColWidth = 110;
  const tableWidth = pageWidth - margin*2;
  const dayColWidth = (tableWidth - nameColWidth) / 7;
  const rowHeight = 26;
  const sectionHeaderHeight = 20;

  const matchingIds = roleFilter ? new Set(state.employees.filter(e => employeeMatchesRoleFilter(e, roleFilter)).map(e=>e.id)) : null;
  const relevant = state.shifts.filter(s => s.published && weekDates.some(d=>isSameDay(d,s.date)) && (!matchingIds || matchingIds.has(s.employeeId)));
  const empIds = new Set(relevant.map(s=>s.employeeId));
  const rowEmployeesFlat = state.employees.filter(e => empIds.has(e.id));

  function sortedWithinSection(list) {
    return [...list].sort((a,b) => sectionSubOrder(a.role) - sectionSubOrder(b.role) || a.name.localeCompare(b.name));
  }

  // Grouped section list — mirrors the on-screen "All" grid and the iOS PDF
  // export: each entry is { role, employees }, role is null (no header
  // drawn) when a specific section is already being filtered to, since
  // there's nothing left to label. Within a merged section (e.g.
  // Teppan/Kitchen), sectionSubOrder keeps Teppanyaki Chefs listed first
  // and plain Kitchen staff at the bottom.
  let sectionsToRender;
  if (!roleFilter) {
    const grouped = {};
    rowEmployeesFlat.forEach(e => {
      const sec = sectionRole(e.role);
      (grouped[sec] = grouped[sec] || []).push(e);
    });
    const seen = new Set();
    sectionsToRender = [];
    SECTION_ORDER.forEach(sec => {
      seen.add(sec);
      if (grouped[sec] && grouped[sec].length) sectionsToRender.push({ role: sec, employees: sortedWithinSection(grouped[sec]) });
    });
    Object.keys(grouped).forEach(sec => {
      if (!seen.has(sec) && grouped[sec].length) sectionsToRender.push({ role: sec, employees: sortedWithinSection(grouped[sec]) });
    });
  } else {
    sectionsToRender = [{ role: null, employees: sortedWithinSection(rowEmployeesFlat) }];
  }
  const totalEmployeeCount = sectionsToRender.reduce((sum, s) => sum + s.employees.length, 0);

  // Header row
  doc.setFillColor(238,238,238); doc.rect(margin, y, tableWidth, 20, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  weekDates.forEach((d,i) => {
    doc.text(`${weekdayAbbr(d)} ${d.getMonth()+1}/${d.getDate()}`, margin + nameColWidth + i*dayColWidth + 6, y + 13);
  });
  y += 20;

  if (!totalEmployeeCount) {
    doc.setDrawColor(200);
    doc.rect(margin, y, tableWidth, rowHeight);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(150);
    doc.text('No published shifts for this selection.', margin+6, y+16);
    doc.setTextColor(0);
    y += rowHeight;
  } else {
    let pageStartY = y;
    let pageRowCount = 0;

    // Draws the bordered table box + grid lines for one contiguous run of
    // rows on the current page (a section header is NOT part of the box —
    // it's a label drawn between boxes). Called right before each section
    // header (to close out the previous section's box) and once more at
    // the very end.
    function flushBox() {
      if (!pageRowCount) return;
      const boxHeight = pageRowCount * rowHeight;
      doc.setDrawColor(220);
      doc.rect(margin, pageStartY, tableWidth, boxHeight);
      for (let i=1;i<pageRowCount;i++) {
        doc.setDrawColor(230);
        doc.line(margin, pageStartY + i*rowHeight, margin+tableWidth, pageStartY + i*rowHeight);
      }
      for (let i=0;i<=7;i++) {
        const x = margin + nameColWidth + i*dayColWidth;
        doc.setDrawColor(220);
        doc.line(x, pageStartY, x, pageStartY + boxHeight);
      }
    }

    sectionsToRender.forEach(section => {
      if (section.role) {
        flushBox();
        if (y > pageHeight - margin - sectionHeaderHeight - 60) {
          doc.addPage(); y = margin;
        }
        doc.setFillColor(217,217,217); doc.rect(margin, y, tableWidth, sectionHeaderHeight, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(90);
        doc.text(filterChipTitle(section.role).toUpperCase(), margin+6, y+13);
        doc.setTextColor(0);
        y += sectionHeaderHeight;
        pageStartY = y;
        pageRowCount = 0;
      }
      section.employees.forEach(emp => {
        if (y > pageHeight - margin - rowHeight - 60) {
          flushBox();
          doc.addPage(); y = margin; pageStartY = margin; pageRowCount = 0;
        }
        const rowY = y;
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(0);
        doc.text(emp.name, margin+6, rowY + rowHeight/2 + 3);
        weekDates.forEach((d,ci) => {
          const dayShifts = relevant.filter(s => s.employeeId===emp.id && isSameDay(s.date,d)).sort((a,b)=>a.startTime-b.startTime);
          const cellX = margin + nameColWidth + ci*dayColWidth;
          dayShifts.forEach((sh, si) => {
            const segH = (rowHeight-4) / dayShifts.length;
            const segY = rowY + 2 + si*segH;
            const [r,g,b] = hexToRgb(roleColor(sh.role));
            doc.setFillColor(r,g,b); doc.setGState(new doc.GState({opacity:0.18}));
            doc.roundedRect(cellX+2, segY, dayColWidth-4, segH-1, 3, 3, 'F');
            doc.setGState(new doc.GState({opacity:1}));
            doc.setDrawColor(r,g,b);
            doc.roundedRect(cellX+2, segY, dayColWidth-4, segH-1, 3, 3, 'S');
            doc.setTextColor(r,g,b); doc.setFont('helvetica','bold'); doc.setFontSize(8);
            doc.text(formatTime(sh.startTime) + (sh.vacuumDuty ? ' (V)' : '') + (sh.ventCleaning ? ' (VC)' : ''), cellX + dayColWidth/2, segY + segH/2 + 3, { align: 'center' });
          });
        });
        y += rowHeight;
        pageRowCount++;
      });
    });
    flushBox();
  }

  // Legend
  let legendY = y + 24;
  const rolesUsed = [...new Set(relevant.map(s=>s.role))];
  let legendX = margin;
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  rolesUsed.forEach(r => {
    const [cr,cg,cb] = hexToRgb(roleColor(r));
    doc.setFillColor(cr,cg,cb);
    doc.circle(legendX+4, legendY-3, 4, 'F');
    doc.setTextColor(90);
    doc.text(r, legendX+14, legendY);
    legendX += 14 + doc.getTextWidth(r) + 18;
  });
  doc.setTextColor(0);

  // Explains the "(V)" / "(VC)" suffixes printed on shift cells — only shown
  // when at least one shift in this export actually uses one.
  const usesVacuum = relevant.some(s => s.vacuumDuty);
  const usesVent = relevant.some(s => s.ventCleaning);
  if (usesVacuum || usesVent) {
    const noteParts = [];
    if (usesVacuum) noteParts.push('(V) = Vacuum Duty');
    if (usesVent) noteParts.push('(VC) = Vent Cleaning');
    doc.setTextColor(90);
    doc.text(noteParts.join('   '), margin, legendY + 16);
    doc.setTextColor(0);
  }

  doc.save(`Shirasoni-Schedule-${(roleFilter?filterChipTitle(roleFilter):'All-Staff').replace(/\//g,'-')}-${weekDates[0].toISOString().slice(0,10)}.pdf`);
}
function hexToRgb(hex) {
  const v = hex.replace('#','');
  return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)];
}

// ============================================================================
// INIT
// ============================================================================
render();
</script>
</body>
</html>
